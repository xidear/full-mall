server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 后台 SPA 把 /admin/v1/** 反代到 api，上传请求也走这里：
    # nginx 默认 1MB，不放开会让 >1MB 的图片/视频在边缘就 413（业务上限是 5MB/10MB）。
    client_max_body_size 72m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后台 SPA 用同源相对路径访问后端；容器内通过 compose 服务名 api 转发
    location /admin/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /store/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /supplier/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /support/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
