# GitHub → Gitee 单向镜像（2026-11-06）
#
# 为什么不用「Gitee 拉取」：Gitee 的 /api/v5/repos/{owner}/{repo}/mirrors 对本账号所有方法返回 405，
# 该功能未开放（需企业版或在网页手动开启）。
#
# 认证方式（2026-11-06 改）：**SSH 证书**，不再用私人令牌。
# - secret `GITEE_SSH_KEY`：Gitee 账户级 ed25519 私钥（与本机密钥分开一把，注释 full-mall CI）。
# - 为什么不用「部署公钥」：Gitee 部署公钥是**只读**的，实测推送被拒（Could not read from remote repository），
#   靠它推镜像必然失败；所以用账户级密钥。代价是这把密钥能干 xidear 名下所有 Gitee 仓库，泄露必须立刻删 key。
# - 缺 secret 直接失败，不静默跳过。
#
# 已知坑：2026-11-06 首次运行 Push 步骤零输出挂 10 分钟（git-remote-https 建连后无响应），
# 现先 curl 预检 gitee.com，再以 lowSpeedLimit 让卡死的推送明确失败。
name: Mirror to Gitee

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: true

jobs:
  mirror:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 预检 gitee.com 可达性
        run: |
          set -euo pipefail
          code=$(curl -sS -m 15 -o /dev/null -w "%{http_code}" https://gitee.com/ || echo "000")
          echo "gitee.com 探测返回 $code"
          if [ "$code" != "200" ] && [ "$code" != "301" ] && [ "$code" != "302" ]; then
            echo "::error::GitHub runner 无法访问 gitee.com（返回 $code），镜像未执行"
            exit 1
          fi

      - name: Push branches and tags to Gitee (SSH)
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GITEE_SSH_KEY}" ]; then
            echo "::error::GITEE_SSH_KEY secret 未配置，镜像未执行"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf "%s\n" "$GITEE_SSH_KEY" > ~/.ssh/id_ed25519_gitee
          chmod 600 ~/.ssh/id_ed25519_gitee
          # keyscan 失败就不写 known_hosts，后面 StrictHostKeyChecking=yes 会直接报错——不静默放行。
          if ! ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::无法获取 gitee.com 主机密钥，镜像未执行"
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519_gitee -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # 明文密码/令牌一律不参与；SSH 已由上面的密钥承担认证。
          git -c credential.helper= \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=15 \
              push --force git@gitee.com:xidear/full-mall.git \
              "refs/remotes/origin/*:refs/heads/*" --tags
          echo "镜像完成：$(git rev-parse --short HEAD)"
