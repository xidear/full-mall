name: Secret Guard

# 目的：公开分叉（GitHub / Gitee）绝不能包含 .env、真实凭据或私钥。
# Gitea 内部仓库的 main 允许 .env，因此本任务默认不启用。
# 启用方式：在公开仓库的 Settings → Variables 里设置 PUBLIC_MIRROR=true。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    if: vars.PUBLIC_MIRROR == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbidden files
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|prod|production|dev)$|GITEA_PRIVATE_CREDENTIALS\.md$|\.(pem|key|p12|pfx)$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::公开仓库中禁止出现以下文件："
            echo "$forbidden"
            exit 1
          fi
          echo "OK: 未发现禁止文件"

      - name: Forbidden content patterns
        run: |
          set -euo pipefail
          # 只扫描受版本控制的文本文件
          hits=$(git grep -nIE 'ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(GITEA|GITHUB|GITEE)_(PASSWORD|TOKEN)=[^[:space:]]+' -- . || true)
          if [ -n "$hits" ]; then
            echo "::error::公开仓库中检测到疑似凭据："
            echo "$hits"
            exit 1
          fi
          echo "OK: 未发现凭据特征"