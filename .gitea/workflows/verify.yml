name: Verify

# Gitea（公司内部仓库）用的验证流水线。
# 内容与 .github/workflows/ci.yml 的 e2e 作业一致，都调用 make verify，
# 保证"本地怎么验、CI 就怎么验"，只有一套事实来源。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Verify (后端测试 + 打包 + 前端构建 + 接口对齐 + E2E)
        run: make verify
