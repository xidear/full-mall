# GitHub → Gitee 单向镜像（2026-11-06）
#
# 为什么不用「Gitee 拉取」：Gitee 的 /api/v5/repos/{owner}/{repo}/mirrors 对本账号所有方法返回 405，
# 该功能未开放（需企业版或在网页手动开启）。
#
# 已知坑：2026-11-06 首次运行时 Push 步骤零输出挂 10 分钟（git-remote-https 建立连接后无响应），
# 说明 GitHub 托管 runner 到 gitee.com 的链路不可靠。因此本工作流先做连通性预检，
# 再用 lowSpeedLimit 让推送在卡住时明确失败——不允许“看起来在跑其实已经死了”。
#
# 依赖 secret：GITEE_TOKEN（Gitee 私人令牌，含 projects 读写）。缺失即失败。
# 只在 GitHub 上运行：Gitea 也会读 .github/workflows，重复执行无意义。
name: Mirror to Gitee

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: true

jobs:
  mirror:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 预检 gitee.com 可达性
        run: |
          set -euo pipefail
          code=$(curl -sS -m 15 -o /dev/null -w "%{http_code}" https://gitee.com/ || echo "000")
          echo "gitee.com 探测返回 $code"
          if [ "$code" != "200" ] && [ "$code" != "301" ] && [ "$code" != "302" ]; then
            echo "::error::GitHub runner 无法访问 gitee.com（返回 $code），镜像未执行"
            exit 1
          fi

      - name: Push branches and tags to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::error::GITEE_TOKEN secret 未配置，镜像未执行"
            exit 1
          fi
          # lowSpeedLimit/lowSpeedTime：15 秒内低于 1KB/s 即判定链路死了并失败，
          # 避免像 2026-11-06 那次一样静默挂满整个 timeout。
          git -c credential.helper= \
              -c http.lowSpeedLimit=1000 \
              -c http.lowSpeedTime=15 \
              push --force "https://xidear:${GITEE_TOKEN}@gitee.com/xidear/full-mall.git" \
              "refs/remotes/origin/*:refs/heads/*" --tags
          echo "镜像完成：$(git rev-parse --short HEAD)"
