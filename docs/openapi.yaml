        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupBuyRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupBuyView" }
  /api/v1/group-buys/{code}:
    get:
      tags: [Promotions]
      summary: 按团号查询拼团进度
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupBuyView" }
  /admin/v1/promotions:
    get:
      tags: [Promotions]
      summary: 促销活动列表
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PromotionView" }
    post:
      tags: [Promotions]
      summary: 创建并启用促销
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePromotionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionView" }
  /admin/v1/promotions/{promotionId}/status:
    post:
      tags: [Promotions]
      summary: 启用或结束促销
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: promotionId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: status, required: true, schema: { type: string, enum: [ACTIVE, ENDED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionView" }
  /admin/v1/promotions/group-buys:
    get:
      tags: [Promotions]
      summary: 拼团记录
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: promotionId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupBuyView" }
  /admin/v1/stores:
    get:
      tags: [Stores]
      summary: 全部门店（员工绑定数据范围使用）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Store" }
  /store/v1/my-stores:
    get:
      tags: [Stores]
      summary: 当前员工可访问的门店（门店角色按绑定过滤）
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Store" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    supplierHmac:
      type: apiKey
      in: header
      name: X-Supplier-Signature
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          description: 最小货币单位，如人民币分
        currency:
          type: string
          example: CNY

    MemberAdminView:
      type: object
      properties:
        member: { $ref: "#/components/schemas/PosMember" }
        saleCount: { type: integer }
        totalSpent: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }
    SupplierPing:
      type: object
      properties:
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        serverTime: { type: string, format: date-time }
    SupplierOrderLine:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        title: { type: string }
        skuCode: { type: string }
        supplierSkuCode: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: "#/components/schemas/Money" }
    SupplierOrder:
      type: object
      properties:
        fulfillmentId: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNo: { type: string }
        status: { type: string, enum: [ALLOCATED, ACCEPTED, SHIPPED, CANCELLED, COMPLETED] }
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time }
        carrierCode: { type: string }
        trackingNo: { type: string }
        contactName: { type: string }
        contactPhone: { type: string }
        addressJson: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        note: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/SupplierOrderLine" }
    SupplierCredential:
      type: object
      properties:
        supplierId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        accessKey: { type: string }
        hasCredential: { type: boolean }
        rotatedAt: { type: string, format: date-time }
    SupplierCredentialCreated:
      type: object
      properties:
        supplierId: { type: string, format: uuid }
        accessKey: { type: string }
        secret: { type: string, description: 仅返回一次 }
        WarehouseLocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [WAREHOUSE, STORE, SUPPLIER] }
    ReceiptLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        skuCode: { type: string }
        title: { type: string }
        batchNo: { type: string }
        productionDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        quantity: { type: integer }
        unitCost: { $ref: "#/components/schemas/Money" }
    GoodsReceipt:
      type: object
      properties:
        id: { type: string, format: uuid }
        receiptNo: { type: string }
        locationType: { type: string }
        locationId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, CONFIRMED] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiptLine" }
    StocktakeLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        batchId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        skuCode: { type: string }
        title: { type: string }
        batchNo: { type: string }
        expiryDate: { type: string, format: date }
        systemQuantity: { type: integer }
        countedQuantity: { type: integer }
        variance: { type: integer }
        reason: { type: string }
    Stocktake:
      type: object
      properties:
        id: { type: string, format: uuid }
        stocktakeNo: { type: string }
        locationType: { type: string }
        locationId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, CONFIRMED] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StocktakeLine" }
    StockTransferLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        skuCode: { type: string }
        title: { type: string }
        quantity: { type: integer }
    StockTransfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        transferNo: { type: string }
        fromType: { type: string }
        fromId: { type: string, format: uuid }
        toType: { type: string }
        toId: { type: string, format: uuid }
        status: { type: string, enum: [DRAFT, IN_TRANSIT, RECEIVED, CANCELLED] }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        shippedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StockTransferLine" }
    ReplenishmentSuggestion:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        skuCode: { type: string }
        title: { type: string }
        locationType: { type: string }
        locationId: { type: string, format: uuid }
        availableQuantity: { type: integer }
        targetQuantity: { type: integer }
        suggestedQuantity: { type: integer }
        nearestExpiry: { type: string, format: date }
    PermissionView:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        group: { type: string }
        sortOrder: { type: integer }
    RolePermission:
      type: object
      properties:
        role: { type: string }
        permissions:
          type: array
          items: { type: string }
    PermissionMatrix:
      type: object
      properties:
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PermissionView" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RolePermission" }

    AfterSaleLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderLineId: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        title: { type: string }
        skuCode: { type: string }
        quantity: { type: integer }
    AfterSaleEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventType: { type: string }
        note: { type: string }
        operatorName: { type: string }
        createdAt: { type: string, format: date-time }
    AfterSale:
      type: object
      properties:
        id: { type: string, format: uuid }
        afterSaleNo: { type: string }
        orderId: { type: string, format: uuid }
        orderNo: { type: string }
        type: { type: string, enum: [RETURN, EXCHANGE] }
        status: { type: string }
        reason: { type: string }
        description: { type: string }
        contactPhone: { type: string }
        refundAmount: { $ref: "#/components/schemas/Money" }
        adminNote: { type: string }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/AfterSaleLine" }
        events:
          type: array
          items: { $ref: "#/components/schemas/AfterSaleEvent" }

    PosShift:
      type: object
      required: [id, storeId, cashierName, status, openingFloat, openedAt]
      properties:
        id: { type: string, format: uuid }
        storeId: { type: string, format: uuid }
        cashierName: { type: string }
        status: { type: string, enum: [OPEN, CLOSED, APPROVED] }
        openingFloat: { $ref: "#/components/schemas/Money" }
        expectedCash: { $ref: "#/components/schemas/Money" }
        actualCash: { $ref: "#/components/schemas/Money" }
        variance: { $ref: "#/components/schemas/Money" }
        varianceReason: { type: string }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
    PosShiftView:
      type: object
      properties:
        shift: { $ref: "#/components/schemas/PosShift" }
        cashSales: { $ref: "#/components/schemas/Money" }
        cashRefunds: { $ref: "#/components/schemas/Money" }
        cashIn: { $ref: "#/components/schemas/Money" }
        cashOut: { $ref: "#/components/schemas/Money" }
        expectedCash: { $ref: "#/components/schemas/Money" }
        saleCount: { type: integer }
    PosSaleLine:
      type: object
      properties:
        id: { type: string, format: uuid }
        skuId: { type: string, format: uuid }
        title: { type: string }
        skuCode: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }
        refundedQuantity: { type: integer }
        refundedAmount: { $ref: "#/components/schemas/Money" }
        batchSummary: { type: string, description: FEFO 出货批次号摘要 }
    PosTender:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [CASH, WECHAT, ALIPAY, CARD, STORED_VALUE, OTHER] }
        amount: { $ref: "#/components/schemas/Money" }
        provider: { type: string }
        providerTradeNo: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED, REVERSED] }
        cashTendered: { $ref: "#/components/schemas/Money" }
        change: { $ref: "#/components/schemas/Money" }
        refundedAmount: { $ref: "#/components/schemas/Money" }
        paidAt: { type: string, format: date-time }
    PosSale:
      type: object
      required: [id, saleNo, status, payable, lines, tenders]
      properties:
        id: { type: string, format: uuid }
        saleNo: { type: string }
        storeId: { type: string, format: uuid }
        shiftId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        currency: { type: string }
        subtotal: { $ref: "#/components/schemas/Money" }
        promotionDiscount: { $ref: "#/components/schemas/Money" }
        couponDiscount: { $ref: "#/components/schemas/Money" }
        memberDiscount: { $ref: "#/components/schemas/Money" }
        pointsDiscount: { $ref: "#/components/schemas/Money" }
        payable: { $ref: "#/components/schemas/Money" }
        cashTendered: { $ref: "#/components/schemas/Money" }
        change: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [DRAFT, COMPLETED, VOIDED, PARTIALLY_REFUNDED, REFUNDED] }
        couponId: { type: string, format: uuid }
        couponCode: { type: string }
        pointsRedeemed: { type: integer, format: int64 }
        pointsEarned: { type: integer, format: int64 }
        pointsReversed: { type: integer, format: int64 }
        refunded: { $ref: "#/components/schemas/Money" }
        operatorName: { type: string }
        createdAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PosSaleLine" }
        tenders:
          type: array
          items: { $ref: "#/components/schemas/PosTender" }
    PosMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        memberNo: { type: string }
        name: { type: string }
        phone: { type: string }
        tier: { type: string }
        points: { type: integer, format: int64 }
        storedValue: { $ref: "#/components/schemas/Money" }
    PosCoupon:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        discountType: { type: string, enum: [FIXED, PERCENT] }
        discountValue: { type: integer, format: int64, description: FIXED 为分，PERCENT 为百分比 }
        minSpend: { $ref: "#/components/schemas/Money" }
        maxDiscount: { $ref: "#/components/schemas/Money" }
        currency: { type: string }
        status: { type: string, enum: [ISSUED, LOCKED, USED, EXPIRED] }
        memberId: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
    PosMemberView:
      type: object
      properties:
        member: { $ref: "#/components/schemas/PosMember" }
        coupons:
          type: array
          items: { $ref: "#/components/schemas/PosCoupon" }
    PosSaleView:
      type: object
      required: [sale, paidAmount, remainingAmount, storeName]
      properties:
        sale: { $ref: "#/components/schemas/PosSale" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        remainingAmount: { $ref: "#/components/schemas/Money" }
        member: { $ref: "#/components/schemas/PosMember" }
        coupon: { $ref: "#/components/schemas/PosCoupon" }
        storeName: { type: string }
    PosProduct:
      type: object
      properties:
        skuId: { type: string, format: uuid }
        skuCode: { type: string }
        barcode: { type: string }
        title: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        availableQuantity: { type: integer }
        imageUrl: { type: string }
    PosProvider:
      type: object
      properties:
        code: { type: string }
        label: { type: string }
        requiresMember: { type: boolean }
        mock: { type: boolean }
    PosTenderTotal:
      type: object
      properties:
        tenderType: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
    PosDailyReport:
      type: object
      properties:
        businessDate: { type: string, format: date }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        salesCount: { type: integer }
        refundCount: { type: integer }
        grossSales: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        netSales: { $ref: "#/components/schemas/Money" }
        refundTotal: { $ref: "#/components/schemas/Money" }
        cashTotal: { $ref: "#/components/schemas/Money" }
        pointsDiscount: { $ref: "#/components/schemas/Money" }
        couponDiscount: { $ref: "#/components/schemas/Money" }
        pointsRedeemed: { type: integer, format: int64 }
        pointsEarned: { type: integer, format: int64 }
        couponsUsed: { type: integer, format: int64 }
        cashVariance: { $ref: "#/components/schemas/Money" }
        shiftCount: { type: integer }
        tenderMix:
          type: array
          items: { $ref: "#/components/schemas/PosTenderTotal" }
        shifts:
          type: array
          items: { $ref: "#/components/schemas/PosShiftView" }
    PosReconciliationReport:
      type: object
      properties:
        businessDate: { type: string, format: date }
        storeId: { type: string, format: uuid }
        storeName: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              tenderType: { type: string }
              expectedAmount: { $ref: "#/components/schemas/Money" }
              actualAmount: { $ref: "#/components/schemas/Money" }
              variance: { $ref: "#/components/schemas/Money" }
              status: { type: string }
    Product:
      type: object
      required: [id, title, status, skus]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        categoryId: { type: string }
        brandId: { type: string }
        status: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
        inventoryTrackingLevel: { type: string, enum: [VARIANT, PRODUCT] }
        shelfLifeManaged: { type: boolean }
        images:
          type: array
          items: { type: string, format: uri }
        skus:
          type: array
          items:
            $ref: "#/components/schemas/Sku"
    Sku:
      type: object
      required: [id, skuCode, price, options]
      properties:
        id: { type: string }
        skuCode: { type: string }
        barcode: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        compareAtPrice: { $ref: "#/components/schemas/Money" }
        options:
          type: object
          additionalProperties: { type: string }
        image: { type: string, format: uri }
    ProductPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        page: { type: integer }
        size: { type: integer }
        total: { type: integer, format: int64 }
    Store:
      type: object
      required: [id, name, address, pickupEnabled]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        distanceMeters: { type: integer }
        pickupEnabled: { type: boolean }
        pickupSlots:
          type: array
          items: { type: string }
        stockAvailable: { type: boolean }
    CheckoutRequest:
      type: object
      required: [items, fulfillmentMode, contact]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [skuId, quantity]
            properties:
              skuId: { type: string }
              quantity: { type: integer, minimum: 1 }
        fulfillmentMode:
          type: string
          enum: [SHIP, PICKUP]
        storeId:
          type: string
          description: PICKUP 时必填
        contact:
          type: object
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: string }
            email: { type: string, format: email }
        address:
          type: object
          properties:
            province: { type: string }
            city: { type: string }
            district: { type: string }
            detail: { type: string }
            postalCode: { type: string }
        legalAcceptanceIds:
          type: array
          items: { type: string }
    Order:
      type: object
      required: [id, status, currency, total, lines]
      properties:
        id: { type: string }
        orderNo: { type: string }
        status:
          type: string
          enum: [PENDING_PAYMENT, PAID, ALLOCATED, PARTIALLY_FULFILLED, FULFILLED, CANCELLED, REFUNDED]
        currency: { type: string }
        subtotal: { $ref: "#/components/schemas/Money" }
        shippingFee: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    OrderLine:
      type: object
      required: [id, skuId, title, quantity, unitPrice]
      properties:
        id: { type: string }
        skuId: { type: string }
        title: { type: string }
        skuCode: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: "#/components/schemas/Money" }
        fulfillmentType:
          type: string
          enum: [WAREHOUSE_SHIP, STORE_SHIP, SUPPLIER_DROPSHIP, STORE_PICKUP]
    FulfillmentOrder:
      type: object
      required: [id, type, status, lines]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [WAREHOUSE_SHIP, STORE_SHIP, SUPPLIER_DROPSHIP, STORE_PICKUP]
        status:
          type: string
          enum: [PENDING, ALLOCATED, PICKING, PACKED, SHIPPED, READY_FOR_PICKUP, COMPLETED, CANCELLED]
        sourceId: { type: string }
        carrierCode: { type: string }
        trackingNo: { type: string }
        pickupCode: { type: string }
        pickupExpiresAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
    InventoryBatch:
      type: object
      required: [id, skuId, locationType, locationId, batchNo, quantity, expiryDate, status]
      properties:
        id: { type: string }
        skuId: { type: string }
        locationType: { type: string, enum: [WAREHOUSE, STORE, SUPPLIER] }
        locationId: { type: string }
        batchNo: { type: string }
        productionDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        quantity: { type: integer }
        reservedQuantity: { type: integer }
        status: { type: string, enum: [AVAILABLE, QUARANTINE, NEAR_EXPIRY, EXPIRED, BLOCKED] }
        unitCost: { $ref: "#/components/schemas/Money" }
    PickTask:
      type: object
      required: [id, fulfillmentOrderId, storeId, status, lines]
      properties:
        id: { type: string }
        fulfillmentOrderId: { type: string }
        storeId: { type: string }
