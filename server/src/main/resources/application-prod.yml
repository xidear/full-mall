app:
  mode: prod
  media:
    # 生产优先用 MEDIA_PUBLIC_BASE_URL（CDN/对象存储）；未配置时由 MediaUrlResolver
    # 跟随系统设置里的 site_domain + site_scheme，换域名无需改库。
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  security:
    hsts-enabled: true
  demo:
    read-only: false
  pos:
    require-manager-approval: true
  store:
    auth-required: true
  support:
    auth-required: true
  payment:
    provider: ${PAYMENT_PROVIDER}
  logistics:
    provider: ${LOGISTICS_PROVIDER}

logging:
  level:
    com.fullmall: INFO