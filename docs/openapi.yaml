openapi: 3.1.0
info:
  title: Full Mall API
  version: 1.0.0
  description: |
    源码开放跨境商城 API v1 契约。首发中国大陆，支持多仓/门店/供应商代发/自提。
    金额字段均为最小货币单位整数（如人民币分），并携带 currency。
    公开演示站仅允许 GET 和 /mock/**，禁止 POST/PUT/DELETE。
servers:
  - url: http://localhost:8080
    description: Local
tags:
  - name: Catalog
  - name: Stores
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Fulfillment
  - name: Inventory
  - name: Legal
  - name: Support
  - name: Analytics
  - name: Supplier
  - name: Demo
  - name: POS
paths:
  /api/v1/products:
    get:
      tags: [Catalog]
      summary: 商品列表
      parameters:
        - in: query
          name: locale
          schema: { type: string, default: zh-CN }
        - in: query
          name: market
          schema: { type: string, default: CN }
        - in: query
          name: categoryId
          schema: { type: string }
        - in: query
          name: keyword
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
  /api/v1/products/{productId}:
    get:
      tags: [Catalog]
      summary: 商品详情
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string }
        - in: query
          name: locale
          schema: { type: string, default: zh-CN }
        - in: query
          name: market
          schema: { type: string, default: CN }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/stores:
    get:
      tags: [Stores]
      summary: 查找支持自提的门店
      parameters:
        - in: query
          name: latitude
          schema: { type: number, format: double }
        - in: query
          name: longitude
          schema: { type: number, format: double }
        - in: query
          name: skuId
          schema: { type: string }
        - in: query
          name: market
          schema: { type: string, default: CN }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Store"
  /api/v1/checkout:
    post:
      tags: [Cart, Orders]
      summary: 结算并创建订单
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          description: 同一 key + 同一请求体重复提交返回同一订单；不同请求体返回 409
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: 订单详情
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/orders/{orderId}/fulfillments:
    get:
      tags: [Fulfillment]
      summary: 订单履约单
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FulfillmentOrder"
  /api/v1/payments/mock/{orderId}/pay:
    post:
      tags: [Payments]
      summary: Mock 支付（dev/prod-mock；demo 模式禁用）
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
  /api/v1/legal/documents:
    get:
      tags: [Legal]
      summary: 获取当前生效法律文档
      parameters:
        - in: query
          name: type
          required: true
          schema:
            type: string
            enum: [TERMS, PRIVACY, COOKIE, REFUND, SHIPPING, PICKUP, MEMBERSHIP, SUPPLIER_AGREEMENT]
        - in: query
          name: locale
          schema: { type: string, default: zh-CN }
        - in: query
          name: market
          schema: { type: string, default: CN }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
  /api/v1/legal/acceptances:
    post:
      tags: [Legal]
      summary: 记录法律文档接受
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalAcceptanceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalAcceptance"
  /api/v1/support/conversations:
    post:
      tags: [Support]
      summary: 创建客服会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject]
              properties:
                subject: { type: string }
                orderId: { type: string }
                locale: { type: string, default: zh-CN }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportConversation"
  /api/v1/analytics/overview:
    get:
      tags: [Analytics]
      summary: 经营总览
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: market
          schema: { type: string, default: CN }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
  /admin/v1/products:
    post:
      tags: [Catalog]
      summary: 创建商品（草稿）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpsertRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/v1/inventory/batches:
    get:
      tags: [Inventory]
      summary: 查询批次库存
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: locationType
          schema:
            type: string
            enum: [WAREHOUSE, STORE, SUPPLIER]
        - in: query
          name: locationId
          schema: { type: string }
        - in: query
          name: skuId
          schema: { type: string }
        - in: query
          name: expiringInDays
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryBatch"
  /store/v1/pick-tasks:
    get:
      tags: [Fulfillment]
      summary: 门店拣货任务
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: storeId
          required: true
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, PICKING, PICKED, CANCELLED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PickTask"
  /store/v1/pick-tasks/{taskId}/confirm:
    post:
      tags: [Fulfillment]
      summary: 确认拣货（扫码批次/效期校验）
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batchId, quantity]
              properties:
                batchId: { type: string }
                quantity: { type: integer, minimum: 1 }
                scannedCode: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickTask"
  /store/v1/pickups/{pickupCode}/verify:
    post:
      tags: [Fulfillment]
      summary: 自提核销
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: pickupCode
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationType, verificationValue]
              properties:
                verificationType: { type: string, enum: [PHONE, ID_CARD, PICKUP_CODE] }
                verificationValue: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pickup"
  /supplier/v1/orders:
    get:
      tags: [Supplier]
      summary: 供应商待处理订单
      security: [{ supplierHmac: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING_ACCEPT, ACCEPTED, SHIPPED, CANCELLED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierOrder"
  /open/v1/orders/{orderId}/ship:
    post:
      tags: [Supplier]
      summary: 供应商回传发货
      security: [{ supplierHmac: [] }]
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrierCode, trackingNo]
              properties:
                carrierCode: { type: string }
                trackingNo: { type: string }
                shippedAt: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierOrder"
  /mock/checkout:
    get:
      tags: [Demo]
      summary: 演示站只读结算模拟；不持久化、不调用外部服务
      parameters:
        - in: query
          name: scenario
          schema:
            type: string
            enum: [paid, unpaid, split, pickup]
            default: paid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoCheckoutResult"
  /store/v1/pos/providers:
    get:
      tags: [POS]
      summary: 门店可用收款方式
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosProvider" }
  /store/v1/pos/products:
    get:
      tags: [POS]
      summary: 收银商品搜索（含门店可售库存）
      parameters:
        - { in: query, name: storeId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: keyword, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosProduct" }
  /store/v1/pos/members:
    get:
      tags: [POS]
      summary: 按手机号或会员编号识别会员
      parameters:
        - { in: query, name: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosMemberView" }
  /store/v1/pos/shifts:
    post:
      tags: [POS]
      summary: 开班并登记备用金
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, cashierName, openingFloat]
              properties:
                storeId: { type: string, format: uuid }
                cashierName: { type: string }
                openingFloat: { type: integer, format: int64, minimum: 0 }
                currency: { type: string, default: CNY }
      responses:
        "200":
          description: 开班成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosShiftView" }
  /store/v1/pos/shifts/open:
    get:
      tags: [POS]
      summary: 查询收银员当前未关闭班次
      parameters:
        - { in: query, name: storeId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: cashierName, required: true, schema: { type: string } }
      responses:
        "200":
          description: 存在未关闭班次
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosShiftView" }
        "204":
          description: 没有未关闭班次
  /store/v1/pos/shifts/{shiftId}/close:
    post:
      tags: [POS]
      summary: 关班与现金小结
      parameters:
        - { in: path, name: shiftId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualCash]
              properties:
                actualCash: { type: integer, format: int64, minimum: 0 }
                reason: { type: string, description: 现金差异不为 0 时必填 }
      responses:
        "200":
          description: 关班完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosShiftView" }
  /store/v1/pos/shifts/{shiftId}/cash-movements:
    post:
      tags: [POS]
      summary: 现金收入/支出登记
      parameters:
        - { in: path, name: shiftId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, reason]
              properties:
                type: { type: string, enum: [CASH_IN, CASH_OUT] }
                amount: { type: integer, format: int64, minimum: 1 }
                reason: { type: string }
                operatorName: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosShiftView" }
  /store/v1/pos/shifts/{shiftId}/sales:
    get:
      tags: [POS]
      summary: 本班次最近销售单
      parameters:
        - { in: path, name: shiftId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales:
    post:
      tags: [POS]
      summary: 创建草稿销售单并预占门店批次库存
      parameters:
        - { in: header, name: Idempotency-Key, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeId, shiftId, items]
              properties:
                storeId: { type: string, format: uuid }
                shiftId: { type: string, format: uuid }
                cashierName: { type: string }
                memberId: { type: string, format: uuid }
                items:
                  type: array
                  items:
                    type: object
                    required: [skuId, quantity]
                    properties:
                      skuId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 销售单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
    get:
      tags: [POS]
      summary: 门店当日销售单
      parameters:
        - { in: query, name: storeId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: date, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}:
    get:
      tags: [POS]
      summary: 销售单详情
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/member:
    post:
      tags: [POS]
      summary: 绑定会员
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/coupon:
    post:
      tags: [POS]
      summary: 锁定并核销优惠券
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/points:
    post:
      tags: [POS]
      summary: 积分抵扣（1 积分 = 1 分钱）
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/tenders:
    post:
      tags: [POS]
      summary: 添加组合支付方式
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount]
              properties:
                type: { type: string, enum: [CASH, WECHAT, ALIPAY, CARD, STORED_VALUE, OTHER] }
                amount: { type: integer, format: int64, minimum: 1 }
                cashTendered: { type: integer, format: int64, description: 现金实收，仅 CASH }
                provider: { type: string, default: mock }
                idempotencyKey: { type: string }
                operatorName: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/complete:
    post:
      tags: [POS]
      summary: 完成销售：扣减批次库存、核销券/积分、发放积分
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/void:
    post:
      tags: [POS]
      summary: 作废草稿销售单并释放库存/撤销收款
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/refund:
    post:
      tags: [POS]
      summary: 整单原路退款并回补批次库存
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                operatorName: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /store/v1/pos/sales/{saleId}/refund-lines:
    post:
      tags: [POS]
      summary: 按商品行部分退款（原路退款、批次回补、积分比例扣回）
      parameters:
        - { in: path, name: saleId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [saleLineId, quantity]
                    properties:
                      saleLineId: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                reason: { type: string }
                operatorName: { type: string }
      responses:
        "200":
          description: 退款完成或部分退款完成
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSaleView" }
  /admin/v1/pos/members:
    get:
      tags: [POS]
      summary: 会员列表
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberAdminView" }
    post:
      tags: [POS]
      summary: 新建会员
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone]
              properties:
                name: { type: string }
                phone: { type: string }
                tier: { type: string, enum: [STANDARD, SILVER, GOLD, PLATINUM] }
      responses:
        "200":
          description: OK
