spring:
  application:
    name: fullmall
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fullmall}
    username: ${SPRING_DATASOURCE_USERNAME:fullmall}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # 实体与 Flyway schema 不一致时启动失败，禁止 ddl-auto=update（见架构文档 §1）
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:fullmall}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-local}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # 媒体公共基址：相对路径在写入快照/对外输出前统一转成绝对 http(s) URL
  # 测试期本地上传，上线改为 CDN/云存储域名（只改配置，不改代码）
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080/media}
  mode: ${APP_MODE:dev}
  security:
    hsts-enabled: ${HSTS_ENABLED:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:120}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5273,http://localhost:5274,http://localhost:5275,http://localhost:5276}
  sms:
    # 演示/开发默认 mock；生产必须显式配置真实服务商（ProductionSafetyGuard 会校验）
    provider: mock
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
  logistics:
    provider: ${LOGISTICS_PROVIDER:mock}
  pickup:
    expiry-hours: ${PICKUP_EXPIRY_HOURS:48}
  inventory:
    near-expiry-days: ${NEAR_EXPIRY_DAYS:7}
  demo:
    read-only: ${DEMO_READ_ONLY:false}
  pos:
    require-manager-approval: ${POS_REQUIRE_MANAGER_APPROVAL:false}
  store:
    auth-required: ${STORE_AUTH_REQUIRED:false}
  support:
    auth-required: ${SUPPORT_AUTH_REQUIRED:false}
  warehouse:
    replenishment-target: ${WAREHOUSE_REPLENISHMENT_TARGET:30}
  distribution:
    commission-rate: ${DISTRIBUTION_COMMISSION_RATE:5}
  supplier:
    credential-key: ${SUPPLIER_CREDENTIAL_KEY:}
    timestamp-skew-seconds: ${SUPPLIER_TIMESTAMP_SKEW_SECONDS:300}

logging:
  level:
    root: INFO
    com.fullmall: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{trace_id:-}] [%X{request_id:-}] %logger{36} - %msg%n"