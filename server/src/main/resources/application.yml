spring:
  application:
    name: fullmall
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fullmall}
    username: ${SPRING_DATASOURCE_USERNAME:fullmall}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  servlet:
    multipart:
      # 上传文件解析层上限。为什么必须显式配置：Spring Boot 默认单文件 1MB，
      # 比业务侧 5MB/10MB 的图片视频上限小得多，超过时请求在进 Controller 之前就抛
      # MaxUploadSizeExceededException，看起来像"上传功能坏了"。
      # 必须与 ValidationRules.UPLOAD_MULTIPART_CEILING_BYTES 一致，UploadMultipartGuard 启动即校验。
      max-file-size: ${UPLOAD_MULTIPART_MAX_FILE_SIZE:64MB}
      # 单请求总上限：一个请求里除文件外还有 multipart 头部，留 8MB 余量。
      max-request-size: ${UPLOAD_MULTIPART_MAX_REQUEST_SIZE:72MB}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # 实体与 Flyway schema 不一致时启动失败，禁止 ddl-auto=update（见架构文档 §1）
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:fullmall}
    password: ${SPRING_RABBITMQ_PASSWORD:change-me-local}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  media:
    # 必须是“可被浏览器/小程序直接访问”的绝对基址：开发默认 API 端口，生产设为 https://<公开域名>，
    # 换 CDN/对象存储时只改这里；数据库里的相对路径不需要迁移。
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:${server.port:8080}}
  mode: ${APP_MODE:dev}
  ai:
    # 示例供应商（ollama/mock）是否自动写入 ai_provider：默认 false，需显式 APP_AI_BOOTSTRAP=true。
    # 开着会让"供应商列表"看起来已配置，实际连的是示例地址。
    bootstrap:
      enabled: ${APP_AI_BOOTSTRAP:false}
    # 语义检索（素材/FAQ 的向量索引）：默认开启；没有 embedding 供应商时明确报 409，不静默降级成"按标题搜"
    semantic:
      enabled: ${APP_AI_SEMANTIC_ENABLED:true}
    # AI 客服检索方式：KEYWORD（无需向量服务）/ SEMANTIC（需要 embedding）。
    # 必须显式选择而不是失败后自动切换，否则运营以为在用语义检索。
    # 本机可用 tools/embedding-service（41291）作为 openai-embedding 供应商。
    ask:
      retrieval: ${APP_AI_ASK_RETRIEVAL:KEYWORD}
      min-score: 0.72
      # 关键词分与余弦分不是同一尺度，阈值分开配置（bigram 重合率 0..1）
      keyword-min-score: 0.15
      top-k: 5
  # 构建分版标识：community（开源）/ enterprise（含 AI 与许可）。
  # 由 Maven profile 注入环境变量 APP_EDITION，缺省按社区版处理。
  # 构建形态：internal（内部/企业版，功能齐全，默认）/ community（开源版，不含模型权重与托管能力）。
  # 开源构建必须显式 -DAPP_EDITION=community，避免"以为是社区版所以功能被隐藏"。
  edition: ${APP_EDITION:internal}
  security:
    hsts-enabled: ${HSTS_ENABLED:false}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:120}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:41281,http://localhost:41282,http://localhost:41283,http://localhost:41284,http://localhost:41285,http://localhost:41286,http://127.0.0.1:41281,http://127.0.0.1:41282,http://127.0.0.1:41283,http://127.0.0.1:41284,http://127.0.0.1:41285,http://127.0.0.1:41286,http://192.168.1.15:41281,http://192.168.1.15:41282,http://192.168.1.15:41283,http://192.168.1.15:41284,http://192.168.1.15:41285,http://192.168.1.15:41286,https://company.binnarui.com,http://company.binnarui.com:20051,https://company.binnarui.com:15443,http://company.binnarui.com:15051,http://company.binnarui.com:15052}
  ops:
    # 多机部署：name=url 逗号分隔；每个主机跑一个 ops-agent
    agents: ${OPS_AGENTS:local=http://127.0.0.1:41287}
    token: ${OPS_TOKEN:}
    request-timeout-ms: ${OPS_REQUEST_TIMEOUT_MS:15000}
  ssl:
    helper-url: ${SSL_HELPER_URL:http://127.0.0.1:41287}
  sms:
    # 演示/开发默认 mock；生产必须显式配置真实服务商（ProductionSafetyGuard 会校验）
    provider: mock
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
  logistics:
    provider: ${LOGISTICS_PROVIDER:mock}
  pickup:
    expiry-hours: ${PICKUP_EXPIRY_HOURS:48}
  inventory:
    near-expiry-days: ${NEAR_EXPIRY_DAYS:7}
  demo:
    read-only: ${DEMO_READ_ONLY:false}
  pos:
    require-manager-approval: ${POS_REQUIRE_MANAGER_APPROVAL:false}
  store:
    auth-required: ${STORE_AUTH_REQUIRED:false}
  fx:
    # 订单汇率快照的基准币种（报表/对账口径）；缺失时启动失败，不默认 CNY
    base-currency: ${APP_FX_BASE_CURRENCY:CNY}
    auto:
      # 自动拉取间隔（毫秒）：默认 1 小时；未配置汇率供应商时任务空转，不影响启动
      interval-ms: ${APP_FX_AUTO_INTERVAL_MS:3600000}
      initial-delay-ms: ${APP_FX_AUTO_INITIAL_DELAY_MS:60000}
  support:
    auth-required: ${SUPPORT_AUTH_REQUIRED:false}
  warehouse:
    replenishment-target: ${WAREHOUSE_REPLENISHMENT_TARGET:30}
  distribution:
    commission-rate: ${DISTRIBUTION_COMMISSION_RATE:5}
  supplier:
    credential-key: ${SUPPLIER_CREDENTIAL_KEY:}
    timestamp-skew-seconds: ${SUPPLIER_TIMESTAMP_SKEW_SECONDS:300}

logging:
  level:
    root: INFO
    com.fullmall: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{trace_id:-}] [%X{request_id:-}] %logger{36} - %msg%n"